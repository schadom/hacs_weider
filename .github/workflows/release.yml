name: Release
on:
  release:
    types: [published]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build integration archive
        run: cd custom_components/weider && zip -r ../../weider.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: weider.zip

